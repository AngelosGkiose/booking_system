services:
  postgres:
    image: postgres:17
    container_name: booking_postgres

    env_file:
      - backend/.env.docker
    ports:
      - "5640:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7
    container_name: booking_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: booking_api
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env.docker
    depends_on:
      - postgres
      - redis
  outbox_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: booking_outbox_worker
    env_file:
      - ./backend/.env.docker
    depends_on:
      - postgres
      - redis
    command: python -m app.workers.outbox_worker
  rq_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: booking_rq_worker
    env_file:
      - ./backend/.env.docker
    depends_on:
      - postgres
      - redis
    command: rq worker -w rq.worker.SimpleWorker reservations --with-scheduler
volumes:
  postgres_data:
  redis_data:

