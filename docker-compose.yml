services:
  postgres:
    image: postgres:17
    container_name: booking_postgres

    env_file:
      - .env.docker
    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7
    container_name: booking_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:

