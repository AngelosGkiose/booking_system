resolver 127.0.0.11 valid=10s;

server {
    listen 80;

    server_name api.aggelosgkiose.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        set $backend http://api:8000;
        proxy_pass $backend;
    }

}
server {
    listen 443 ssl;

    server_name api.aggelosgkiose.dev;

    ssl_certificate /etc/letsencrypt/live/api.aggelosgkiose.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.aggelosgkiose.dev/privkey.pem;

location / {
    set $backend http://api:8000;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_pass $backend;
}
}